name: CD Pipeline

on:
  workflow_run:
    # CI Pipeline이 실행된 후 실행
    workflows: ["CI Pipeline"]
    types:
      - completed

jobs:
  deploy:
    # GitHub hosted runner 사용
    runs-on: ubuntu-latest
    # CI Pipeline이 성공했을 때만 실행
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    steps:
      # SSH를 통해 EC2 서버에서 배포 실행
      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            # 작업 디렉토리로 이동
            cd ~/DEPLOY-CONFIGS
            git pull origin main

            # S3에서 .env 파일 다운로드
            aws s3 cp s3://${{ secrets.PRIVATE_S3_BUCKET_NAME }}/deploy/.env ./.env

            # Docker Hub 로그인
            echo ${{ secrets.DOCKER_ACCESS_TOKEN }} | docker login -u ${{ secrets.DOCKER_USERNAME }} --password-stdin

            # fastapi-app 중지 및 제거
            docker compose stop fastapi-app || true
            docker compose rm -f fastapi-app || true

            # kafka-consumer 중지 및 제거
            docker compose stop overview-consumer || true
            docker compose rm -f overview-consumer || true

            docker compose stop analysis-consumer || true
            docker compose rm -f analysis-consumer || true

            docker compose stop idea-consumer || true
            docker compose rm -f idea-consumer || true

            # 이전 Docker 이미지 정리
            docker images ${{ secrets.DOCKER_USERNAME }}/channeling-llm -q | xargs -r docker rmi -f || true
            docker image prune -f

            # 최신 Docker 이미지 Pull
            docker pull ${{ secrets.DOCKER_USERNAME }}/channeling-llm:latest

            # 서비스 재시작
            docker compose up -d --no-deps fastapi-app
            docker compose up -d --no-deps overview-consumer
            docker compose up -d --no-deps analysis-consumer
            docker compose up -d --no-deps idea-consumer

            echo "Deployment completed successfully!"
